<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer-MRO">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f0b2e">
<title>Timer-MRO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    background: #0f0b2e;
    background: radial-gradient(circle at 50% 35%, #312e81 0%, #0f0b2e 70%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    width: 100%;
    padding: 3vh 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
  }
  /* Ringgröße: passt sich Höhe und Breite an (Bedienung immer darunter) */
  .ring {
    --size: min(56vh, 80vw);
    --size: min(56dvh, 80vw);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin-bottom: 1vh;
  }
  .ring svg {
    display: block;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }
  .ring .track { stroke: rgba(255, 255, 255, 0.08); }
  .ring .bar {
    -webkit-filter: drop-shadow(0 0 3px #a855f7);
    filter: drop-shadow(0 0 3px #a855f7);
    transition: stroke-dashoffset 0.25s linear;
  }
  .ring .bar.empty { opacity: 0; }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .display {
    font-size: calc(var(--size) * 0.17);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-align: center;
    white-space: nowrap;
  }
  .display.done { color: #fecaca; }
  .picker {
    position: relative;
    display: flex;
    align-items: stretch;
    width: min(420px, 80vw);
  }
  .picker input {
    flex: 1;
    min-width: 0;
    font-size: 32px;
    padding: 14px 18px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-right: none;
    border-radius: 16px 0 0 16px;
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    outline: none;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
    -webkit-appearance: none;
    appearance: none;
    -webkit-touch-callout: default;
  }
  .picker input::placeholder { color: rgba(255, 255, 255, 0.6); }
  .picker input:focus { background: rgba(255, 255, 255, 0.28); }
  .picker input.invalid { border-color: #fca5a5; }
  .toggle {
    width: 72px;
    font-size: 26px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 0 16px 16px 0;
    background: rgba(255, 255, 255, 0.28);
    color: #ffffff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
  }
  .toggle:active { background: rgba(255, 255, 255, 0.4); }
  .list {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    max-height: 40vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0;
    padding: 6px;
    list-style: none;
    border-radius: 16px;
    background: rgba(30, 27, 75, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
  .list.open { display: block; }
  .list.up { top: auto; bottom: calc(100% + 8px); }
  .list li {
    font-size: 26px;
    padding: 14px 18px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .list li:hover, .list li.active { background: rgba(255, 255, 255, 0.18); }
  .modes {
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  .modes button {
    min-width: 100px;
    min-height: 40px;
    padding: 8px 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
  }
  .modes button.active { background: rgba(255, 255, 255, 0.4); }
  .picker.clock input { border-right: 1px solid rgba(255, 255, 255, 0.4); border-radius: 16px; }
  .picker.clock .toggle, .picker.clock .list { display: none; }
  .info {
    min-height: 1.4em;
    margin-top: calc(var(--size) * 0.03);
    font-size: max(15px, calc(var(--size) * 0.042));
    color: #a5b4fc;
    text-align: center;
  }
  .error {
    min-height: 1.4em;
    font-size: 20px;
    color: #fecaca;
    text-align: center;
  }
  .error:empty { display: none; }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
  }
  .buttons button {
    min-width: 85px;
    min-height: 40px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    color: #ffffff;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .buttons button:active { transform: scale(0.96); }
  .buttons button:disabled { opacity: 0.4; cursor: default; transform: none; }
  #btnStart  { background: #16a34a; }
  #btnStop   { background: #dc2626; }
  #btnResume { background: #2563eb; }
  #btnReset  { background: #6b7280; }
</style>
</head>
<body>
<div class="panel">
  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/>
          <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="4"/>
      <circle class="bar" id="ringBar" cx="50" cy="50" r="45" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
    </svg>
    <div class="ring-center">
      <div class="display" id="display">01:30:00</div>
      <div class="info" id="info"></div>
    </div>
  </div>

  <div class="modes" role="group" aria-label="Modus">
    <button type="button" id="modeDuration" class="active">Dauer</button>
    <button type="button" id="modeClock">Uhrzeit</button>
  </div>

  <div class="picker" id="picker">
    <input type="text" id="timeInput" value="1:30" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="H:MM" aria-label="Zeit (H:MM)">
    <button type="button" class="toggle" id="toggle" aria-label="Vorschläge anzeigen">&#9662;</button>
    <ul class="list" id="list" role="listbox"></ul>
  </div>

  <div class="error" id="error" role="alert"></div>

  <div class="buttons">
    <button type="button" id="btnStart">Start</button>
    <button type="button" id="btnStop">Stop</button>
    <button type="button" id="btnResume">Resume</button>
    <button type="button" id="btnReset">Reset</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PRESETS = ["0:06", "0:10", "0:12", "0:15", "0:30", "0:45", "1:00", "1:15", "1:30", "1:45", "2:00", "2:15", "2:30", "2:53"];
  var ERROR_TEXT = "Bitte Format H:MM verwenden, z. B. 1:30";
  var ERROR_TEXT_CLOCK = "Bitte Uhrzeit im Format HH:MM verwenden, z. B. 14:30";
  var DEFAULT_TIME = "1:30";

  var displayEl = document.getElementById("display");
  var inputEl = document.getElementById("timeInput");
  var toggleEl = document.getElementById("toggle");
  var listEl = document.getElementById("list");
  var pickerEl = document.getElementById("picker");
  var errorEl = document.getElementById("error");
  var btnStart = document.getElementById("btnStart");
  var btnStop = document.getElementById("btnStop");
  var btnResume = document.getElementById("btnResume");
  var btnReset = document.getElementById("btnReset");
  var modeDurationEl = document.getElementById("modeDuration");
  var modeClockEl = document.getElementById("modeClock");
  var infoEl = document.getElementById("info");
  var ringBarEl = document.getElementById("ringBar");

  var state = {
    baseMs: parseTime(DEFAULT_TIME),
    remainingMs: parseTime(DEFAULT_TIME),
    endTime: 0,
    running: false,
    intervalId: null,
    alertPending: false,
    mode: "duration",
    target: 0,
    clock: null,
    values: { duration: DEFAULT_TIME, clock: "" },
    targetText: ""
  };

  function parseTime(text) {
    var m = /^(\d{1,2}):([0-5]\d)$/.exec(String(text).trim());
    if (!m) { return null; }
    var ms = (parseInt(m[1], 10) * 3600 + parseInt(m[2], 10) * 60) * 1000;
    return ms > 0 ? ms : null;
  }

  function parseClock(text) {
    var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(text).trim());
    if (!m) { return null; }
    return { h: parseInt(m[1], 10), m: parseInt(m[2], 10) };
  }

  // Nächster Zeitpunkt mit dieser Uhrzeit: heute, sonst morgen
  function nextTarget(clock) {
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.h, clock.m, 0, 0);
    if (t.getTime() <= now.getTime()) {
      t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, clock.h, clock.m, 0, 0);
    }
    return t.getTime();
  }

  function isTomorrow(ms) {
    var now = new Date();
    var t = new Date(ms);
    return t.getDate() !== now.getDate() || t.getMonth() !== now.getMonth() || t.getFullYear() !== now.getFullYear();
  }

  function setTarget(clock) {
    state.clock = clock;
    state.target = nextTarget(clock);
    state.targetText = "Ziel: " + pad(clock.h) + ":" + pad(clock.m) + " Uhr (" + (isTomorrow(state.target) ? "morgen" : "heute") + ")";
  }

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function format(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function infoText() {
    if (state.remainingMs <= 0) { return "Zeit abgelaufen"; }
    if (state.mode === "clock") { return state.targetText; }
    if (state.running) {
      var end = new Date(state.endTime);
      return "Ende um " + pad(end.getHours()) + ":" + pad(end.getMinutes()) + " Uhr";
    }
    return "";
  }

  function render() {
    displayEl.textContent = format(state.remainingMs);
    displayEl.classList.toggle("done", state.remainingMs <= 0);
    // Ring: Anteil der verbleibenden Zeit
    var frac = state.baseMs > 0 ? Math.min(1, Math.max(0, state.remainingMs / state.baseMs)) : 0;
    ringBarEl.setAttribute("stroke-dashoffset", String(100 * (1 - frac)));
    ringBarEl.classList.toggle("empty", frac <= 0);
    var info = infoText();
    if (infoEl.textContent !== info) { infoEl.textContent = info; }
    btnStop.disabled = !state.running;
    btnResume.disabled = state.running || state.remainingMs <= 0 || state.remainingMs >= state.baseMs;
  }

  function clearTick() {
    if (state.intervalId !== null) {
      clearInterval(state.intervalId);
      state.intervalId = null;
    }
  }

  function showError(show) {
    errorEl.textContent = show ? (state.mode === "clock" ? ERROR_TEXT_CLOCK : ERROR_TEXT) : "";
    inputEl.classList.toggle("invalid", !!show);
  }

  function tick() {
    if (!state.running) { return; }
    state.remainingMs = state.endTime - Date.now();
    if (state.remainingMs <= 0) {
      finish();
      return;
    }
    render();
  }

  function finish() {
    clearTick();
    state.running = false;
    state.remainingMs = 0;
    render();
    state.alertPending = true;
    // iOS unterdrückt alert() in Hintergrund-Tabs: erst anzeigen, wenn sichtbar
    if (!document.hidden) { showAlert(); }
  }

  function showAlert() {
    if (!state.alertPending) { return; }
    state.alertPending = false;
    setTimeout(function () {
      alert("Zeit abgelaufen!");
    }, 30);
  }

  function wake() {
    tick();
    if (!document.hidden) { showAlert(); }
  }

  function run() {
    clearTick();
    state.alertPending = false;
    state.running = true;
    // Uhrzeit-Modus: immer gegen die feste Zielzeit zählen
    state.endTime = state.mode === "clock" ? state.target : Date.now() + state.remainingMs;
    state.intervalId = setInterval(tick, 200);
    tick();
  }

  function stop() {
    if (!state.running) { return; }
    state.remainingMs = Math.max(0, state.endTime - Date.now());
    clearTick();
    state.running = false;
    render();
  }

  function applyInput() {
    var ms;
    if (state.mode === "clock") {
      var clock = parseClock(inputEl.value);
      if (clock === null) {
        showError(true);
        return false;
      }
      setTarget(clock);
      ms = state.target - Date.now();
    } else {
      ms = parseTime(inputEl.value);
      if (ms === null) {
        showError(true);
        return false;
      }
    }
    state.values[state.mode] = inputEl.value.trim();
    showError(false);
    clearTick();
    state.running = false;
    state.baseMs = ms;
    state.remainingMs = ms;
    render();
    return true;
  }

  function start() {
    closeList();
    if (!applyInput()) { return; }
    run();
  }

  function resume() {
    if (state.running || state.remainingMs <= 0) { return; }
    run();
  }

  function reset() {
    clearTick();
    state.alertPending = false;
    state.running = false;
    if (state.mode === "clock" && state.clock) {
      setTarget(state.clock);
      state.baseMs = state.target - Date.now();
    }
    state.remainingMs = state.baseMs;
    render();
  }

  // Modus Dauer / Uhrzeit
  function defaultClock() {
    var d = new Date(Date.now() + 3600000);
    return pad(d.getHours()) + ":00";
  }

  function setMode(mode) {
    if (mode === state.mode) { return; }
    closeList();
    clearTick();
    state.running = false;
    state.alertPending = false;
    state.mode = mode;
    var clockMode = mode === "clock";
    modeDurationEl.classList.toggle("active", !clockMode);
    modeClockEl.classList.toggle("active", clockMode);
    pickerEl.classList.toggle("clock", clockMode);
    inputEl.placeholder = clockMode ? "HH:MM" : "H:MM";
    inputEl.setAttribute("aria-label", clockMode ? "Zielzeit (HH:MM)" : "Zeit (H:MM)");
    state.targetText = "";
    inputEl.value = state.values[mode] || (clockMode ? defaultClock() : DEFAULT_TIME);
    applyInput();
  }

  modeDurationEl.addEventListener("click", function () { setMode("duration"); });
  modeClockEl.addEventListener("click", function () { setMode("clock"); });

  // Dropdown
  function buildList() {
    var frag = document.createDocumentFragment();
    PRESETS.forEach(function (p) {
      var li = document.createElement("li");
      li.textContent = p;
      li.setAttribute("role", "option");
      li.setAttribute("data-value", p);
      frag.appendChild(li);
    });
    listEl.appendChild(frag);
  }

  function openList() {
    var items = listEl.children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", items[i].getAttribute("data-value") === inputEl.value.trim());
    }
    // Nach oben öffnen, wenn unten zu wenig Platz ist
    var r = pickerEl.getBoundingClientRect();
    var below = window.innerHeight - r.bottom;
    listEl.classList.toggle("up", below < 260 && r.top > below);
    listEl.classList.add("open");
  }

  function closeList() {
    listEl.classList.remove("open");
  }

  function isListOpen() {
    return listEl.classList.contains("open");
  }

  toggleEl.addEventListener("click", function (e) {
    e.stopPropagation();
    if (isListOpen()) { closeList(); } else { openList(); }
  });

  listEl.addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== listEl && t.tagName !== "LI") { t = t.parentNode; }
    if (!t || t === listEl) { return; }
    inputEl.value = t.getAttribute("data-value");
    closeList();
    applyInput();
  });

  function onOutside(e) {
    if (isListOpen() && !pickerEl.contains(e.target)) { closeList(); }
  }
  document.addEventListener("mousedown", onOutside);
  document.addEventListener("touchstart", onOutside, { passive: true });

  // Freie Eingabe
  inputEl.addEventListener("change", function () {
    applyInput();
  });
  inputEl.addEventListener("input", function () {
    var ok = state.mode === "clock" ? parseClock(inputEl.value) !== null : parseTime(inputEl.value) !== null;
    if (errorEl.textContent && ok) { showError(false); }
  });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      closeList();
      applyInput();
      inputEl.blur();
    } else if (e.key === "Escape") {
      closeList();
    }
  });

  btnStart.addEventListener("click", start);
  btnStop.addEventListener("click", stop);
  btnResume.addEventListener("click", resume);
  btnReset.addEventListener("click", reset);

  // Nach Tab-Wechsel sofort korrekt aktualisieren
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { wake(); }
  });
  window.addEventListener("pageshow", wake);
  window.addEventListener("focus", wake);

  buildList();
  render();

  // PWA: Service Worker nur über http(s) registrieren (bei file:// läuft die App ohne)
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
