<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer-MRO">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f0b2e">
<title>Timer-MRO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    background: #0f0b2e;
    background: radial-gradient(circle at 50% 35%, #312e81 0%, #0f0b2e 70%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; cursor: pointer; }

  /* Zwei Seiten: Timer und Einstellungen */
  .view {
    display: none;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 3vh 16px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  body:not(.setup) #timerView { display: flex; }
  body.setup #setupView { display: flex; }

  .corner {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    min-height: 44px;
    min-width: 44px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .corner:active { background: rgba(255, 255, 255, 0.14); }
  .gear { right: 16px; width: 44px; height: 44px; border-radius: 50%; font-size: 22px; padding: 0; }
  .back { left: 16px; border: none; background: none; font-size: 17px; padding: 0 8px; }

  /* Timer-Seite */
  .ring {
    --size: min(60vh, 80vw);
    --size: min(60dvh, 80vw);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin-bottom: 5vh;
  }
  .ring svg {
    display: block;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }
  .ring .track { stroke: rgba(255, 255, 255, 0.08); }
  .ring .bar {
    -webkit-filter: drop-shadow(0 0 3px #a855f7);
    filter: drop-shadow(0 0 3px #a855f7);
    transition: stroke-dashoffset 0.25s linear;
  }
  .ring .bar.empty { opacity: 0; }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .display {
    font-size: calc(var(--size) * 0.17);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-align: center;
    white-space: nowrap;
  }
  .display.done { color: #fecaca; }
  .info {
    min-height: 1.4em;
    margin-top: calc(var(--size) * 0.03);
    font-size: max(15px, calc(var(--size) * 0.042));
    color: #a5b4fc;
    text-align: center;
  }
  .preset {
    font-size: max(12px, calc(var(--size) * 0.03));
    letter-spacing: 0.04em;
    color: #6366f1;
    font-variant-numeric: tabular-nums;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .buttons button {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: transform 0.08s ease, opacity 0.15s ease, border-color 0.15s ease;
  }
  .buttons button i { width: 8px; height: 8px; border-radius: 50%; }
  .buttons button:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.14); }
  .buttons button:disabled { opacity: 0.35; cursor: default; transform: none; }
  #btnStart i  { background: #22c55e; }
  #btnStop i   { background: #ef4444; }
  #btnResume i { background: #3b82f6; }
  #btnReset i  { background: #9ca3af; }
  /* nächste sinnvolle Aktion leicht hervorheben */
  #btnStart.next  { border-color: rgba(34, 197, 94, 0.55); }
  #btnStop.next   { border-color: rgba(248, 113, 113, 0.55); }
  #btnResume.next { border-color: rgba(96, 165, 250, 0.55); }

  /* Einstellungsseite */
  .setup-card {
    width: min(380px, 86vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .setup-card h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a5b4fc;
  }
  .modes {
    display: flex;
    padding: 3px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .modes button {
    min-width: 96px;
    min-height: 36px;
    padding: 6px 18px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
  }
  .modes button.active { background: rgba(255, 255, 255, 0.16); color: #ffffff; }
  .picker {
    position: relative;
    display: flex;
    align-items: center;
    width: 220px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }
  .picker input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 44px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    padding: 4px 0 8px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: #ffffff;
    outline: none;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
    -webkit-appearance: none;
    appearance: none;
    -webkit-touch-callout: default;
  }
  .picker input::placeholder { color: rgba(255, 255, 255, 0.3); }
  .picker input.invalid { color: #fca5a5; }
  .picker:focus-within { border-bottom-color: #a855f7; }
  .toggle {
    min-width: 44px;
    min-height: 44px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #818cf8;
  }
  .toggle:active { background: rgba(255, 255, 255, 0.1); }
  .list {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: -30px;
    right: -30px;
    max-height: 40vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0;
    padding: 6px;
    list-style: none;
    border-radius: 14px;
    background: rgba(30, 27, 75, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
  .list.open { display: block; }
  .list.up { top: auto; bottom: calc(100% + 8px); }
  .list li {
    font-size: 20px;
    padding: 11px 16px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .list li:hover, .list li.active { background: rgba(168, 85, 247, 0.22); }
  .picker.clock .toggle, .picker.clock .list { display: none; }
  .preview {
    min-height: 1.4em;
    font-size: 15px;
    color: rgba(165, 180, 252, 0.85);
    text-align: center;
  }
  .error {
    font-size: 15px;
    color: #fecaca;
    text-align: center;
  }
  .error:empty { display: none; }
  .apply {
    min-height: 44px;
    padding: 10px 34px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid rgba(168, 85, 247, 0.7);
    background: rgba(168, 85, 247, 0.12);
    color: #e9d5ff;
  }
  .apply:active { background: rgba(168, 85, 247, 0.3); }
</style>
</head>
<body>
<div class="view" id="timerView">
  <button type="button" class="corner gear" id="btnSetup" aria-label="Einstellungen">&#9881;&#xFE0E;</button>

  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/>
          <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="4"/>
      <circle class="bar" id="ringBar" cx="50" cy="50" r="45" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
    </svg>
    <div class="ring-center">
      <div class="display" id="display">01:30:00</div>
      <div class="info" id="info"></div>
      <div class="preset" id="preset"></div>
    </div>
  </div>

  <div class="buttons">
    <button type="button" id="btnStart"><i></i>Start</button>
    <button type="button" id="btnStop"><i></i>Stop</button>
    <button type="button" id="btnResume"><i></i>Resume</button>
    <button type="button" id="btnReset"><i></i>Reset</button>
  </div>
</div>

<div class="view" id="setupView">
  <button type="button" class="corner back" id="btnBack">&lsaquo; Timer</button>

  <div class="setup-card">
    <h1>Timer einstellen</h1>

    <div class="modes" role="group" aria-label="Modus">
      <button type="button" id="modeDuration" class="active">Dauer</button>
      <button type="button" id="modeClock">Uhrzeit</button>
    </div>

    <div class="picker" id="picker">
      <input type="text" id="timeInput" value="1:30" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="H:MM" aria-label="Zeit (H:MM)">
      <button type="button" class="toggle" id="toggle" aria-label="Vorschläge anzeigen">&#9662;</button>
      <ul class="list" id="list" role="listbox"></ul>
    </div>

    <div class="preview" id="preview"></div>
    <div class="error" id="error" role="alert"></div>

    <button type="button" class="apply" id="btnApply">Übernehmen</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PRESETS = ["0:06", "0:10", "0:12", "0:15", "0:30", "0:45", "1:00", "1:15", "1:30", "1:45", "2:00", "2:15", "2:30", "2:53"];
  var ERROR_TEXT = "Bitte Format H:MM verwenden, z. B. 1:30";
  var ERROR_TEXT_CLOCK = "Bitte Uhrzeit im Format HH:MM verwenden, z. B. 14:30";
  var DEFAULT_TIME = "1:30";

  var displayEl = document.getElementById("display");
  var inputEl = document.getElementById("timeInput");
  var toggleEl = document.getElementById("toggle");
  var listEl = document.getElementById("list");
  var pickerEl = document.getElementById("picker");
  var errorEl = document.getElementById("error");
  var previewEl = document.getElementById("preview");
  var btnStart = document.getElementById("btnStart");
  var btnStop = document.getElementById("btnStop");
  var btnResume = document.getElementById("btnResume");
  var btnReset = document.getElementById("btnReset");
  var btnSetup = document.getElementById("btnSetup");
  var btnBack = document.getElementById("btnBack");
  var btnApply = document.getElementById("btnApply");
  var modeDurationEl = document.getElementById("modeDuration");
  var modeClockEl = document.getElementById("modeClock");
  var infoEl = document.getElementById("info");
  var presetEl = document.getElementById("preset");
  var ringBarEl = document.getElementById("ringBar");

  var state = {
    baseMs: parseTime(DEFAULT_TIME),
    remainingMs: parseTime(DEFAULT_TIME),
    endTime: 0,
    running: false,
    intervalId: null,
    alertPending: false,
    mode: "duration",
    target: 0,
    clock: null,
    values: { duration: DEFAULT_TIME, clock: "" },
    targetText: "",
    draftMode: "duration"
  };

  function parseTime(text) {
    var m = /^(\d{1,2}):([0-5]\d)$/.exec(String(text).trim());
    if (!m) { return null; }
    var ms = (parseInt(m[1], 10) * 3600 + parseInt(m[2], 10) * 60) * 1000;
    return ms > 0 ? ms : null;
  }

  function parseClock(text) {
    var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(text).trim());
    if (!m) { return null; }
    return { h: parseInt(m[1], 10), m: parseInt(m[2], 10) };
  }

  // Nächster Zeitpunkt mit dieser Uhrzeit: heute, sonst morgen
  function nextTarget(clock) {
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.h, clock.m, 0, 0);
    if (t.getTime() <= now.getTime()) {
      t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, clock.h, clock.m, 0, 0);
    }
    return t.getTime();
  }

  function isTomorrow(ms) {
    var now = new Date();
    var t = new Date(ms);
    return t.getDate() !== now.getDate() || t.getMonth() !== now.getMonth() || t.getFullYear() !== now.getFullYear();
  }

  function targetText(clock, target) {
    return "Ziel: " + pad(clock.h) + ":" + pad(clock.m) + " Uhr (" + (isTomorrow(target) ? "morgen" : "heute") + ")";
  }

  function setTarget(clock) {
    state.clock = clock;
    state.target = nextTarget(clock);
    state.targetText = targetText(clock, state.target);
  }

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function clockOf(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function format(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function infoText() {
    if (state.remainingMs <= 0) { return "Zeit abgelaufen"; }
    if (state.mode === "clock") { return state.targetText; }
    if (state.running) { return "Ende um " + clockOf(state.endTime) + " Uhr"; }
    return "";
  }

  function canResume() {
    return !state.running && state.remainingMs > 0 && state.remainingMs < state.baseMs;
  }

  function render() {
    displayEl.textContent = format(state.remainingMs);
    displayEl.classList.toggle("done", state.remainingMs <= 0);
    // Ring: Anteil der verbleibenden Zeit
    var frac = state.baseMs > 0 ? Math.min(1, Math.max(0, state.remainingMs / state.baseMs)) : 0;
    ringBarEl.setAttribute("stroke-dashoffset", String(100 * (1 - frac)));
    ringBarEl.classList.toggle("empty", frac <= 0);
    var info = infoText();
    if (infoEl.textContent !== info) { infoEl.textContent = info; }
    var preset = (state.mode === "clock" ? "Uhrzeit " : "Dauer ") + state.values[state.mode];
    if (presetEl.textContent !== preset) { presetEl.textContent = preset; }
    btnStop.disabled = !state.running;
    btnResume.disabled = !canResume();
    btnStart.classList.toggle("next", !state.running && !canResume());
    btnStop.classList.toggle("next", state.running);
    btnResume.classList.toggle("next", canResume());
  }

  function clearTick() {
    if (state.intervalId !== null) {
      clearInterval(state.intervalId);
      state.intervalId = null;
    }
  }

  function tick() {
    if (!state.running) { return; }
    state.remainingMs = state.endTime - Date.now();
    if (state.remainingMs <= 0) {
      finish();
      return;
    }
    render();
  }

  function finish() {
    clearTick();
    state.running = false;
    state.remainingMs = 0;
    render();
    state.alertPending = true;
    // iOS unterdrückt alert() in Hintergrund-Tabs: erst anzeigen, wenn sichtbar
    if (!document.hidden) { showAlert(); }
  }

  function showAlert() {
    if (!state.alertPending) { return; }
    state.alertPending = false;
    setTimeout(function () {
      alert("Zeit abgelaufen!");
    }, 30);
  }

  function wake() {
    tick();
    if (!document.hidden) { showAlert(); }
  }

  function run() {
    clearTick();
    state.alertPending = false;
    state.running = true;
    // Uhrzeit-Modus: immer gegen die feste Zielzeit zählen
    state.endTime = state.mode === "clock" ? state.target : Date.now() + state.remainingMs;
    state.intervalId = setInterval(tick, 200);
    tick();
  }

  function stop() {
    if (!state.running) { return; }
    state.remainingMs = Math.max(0, state.endTime - Date.now());
    clearTick();
    state.running = false;
    render();
  }

  // Ausgangswert neu setzen (Uhrzeit-Modus: Zielzeit neu berechnen)
  function rearm() {
    if (state.mode === "clock" && state.clock) {
      setTarget(state.clock);
      state.baseMs = state.target - Date.now();
    }
    state.remainingMs = state.baseMs;
  }

  function start() {
    clearTick();
    state.running = false;
    rearm();
    run();
  }

  function resume() {
    if (state.running || state.remainingMs <= 0) { return; }
    run();
  }

  function reset() {
    clearTick();
    state.alertPending = false;
    state.running = false;
    rearm();
    render();
  }

  // Einstellungsseite
  function defaultClock() {
    var d = new Date(Date.now() + 3600000);
    return pad(d.getHours()) + ":00";
  }

  function showError(show) {
    errorEl.textContent = show ? (state.draftMode === "clock" ? ERROR_TEXT_CLOCK : ERROR_TEXT) : "";
    inputEl.classList.toggle("invalid", !!show);
  }

  function updatePreview() {
    var text = "";
    if (state.draftMode === "clock") {
      var clock = parseClock(inputEl.value);
      if (clock) { text = targetText(clock, nextTarget(clock)); }
    } else {
      var ms = parseTime(inputEl.value);
      if (ms) { text = "läuft bis ca. " + clockOf(Date.now() + ms) + " Uhr"; }
    }
    previewEl.textContent = text;
  }

  // Modus auf der Einstellungsseite nur vormerken; wirksam erst mit „Übernehmen“
  function setDraftMode(mode) {
    closeList();
    showError(false);
    state.draftMode = mode;
    var clockMode = mode === "clock";
    modeDurationEl.classList.toggle("active", !clockMode);
    modeClockEl.classList.toggle("active", clockMode);
    pickerEl.classList.toggle("clock", clockMode);
    inputEl.placeholder = clockMode ? "HH:MM" : "H:MM";
    inputEl.setAttribute("aria-label", clockMode ? "Zielzeit (HH:MM)" : "Zeit (H:MM)");
    inputEl.value = state.values[mode] || (clockMode ? defaultClock() : DEFAULT_TIME);
    updatePreview();
  }

  function openSetup() {
    setDraftMode(state.mode);
    document.body.classList.add("setup");
    window.scrollTo(0, 0);
  }

  function closeSetup() {
    closeList();
    inputEl.blur();
    showError(false);
    document.body.classList.remove("setup");
    window.scrollTo(0, 0);
  }

  // Übernehmen: Timer stoppen und auf den neuen Wert setzen
  function apply() {
    closeList();
    var ms;
    if (state.draftMode === "clock") {
      var clock = parseClock(inputEl.value);
      if (clock === null) {
        showError(true);
        return;
      }
      setTarget(clock);
      ms = state.target - Date.now();
    } else {
      ms = parseTime(inputEl.value);
      if (ms === null) {
        showError(true);
        return;
      }
    }
    state.mode = state.draftMode;
    state.values[state.mode] = inputEl.value.trim();
    clearTick();
    state.running = false;
    state.alertPending = false;
    state.baseMs = ms;
    state.remainingMs = ms;
    render();
    closeSetup();
  }

  modeDurationEl.addEventListener("click", function () { setDraftMode("duration"); });
  modeClockEl.addEventListener("click", function () { setDraftMode("clock"); });
  btnSetup.addEventListener("click", openSetup);
  btnBack.addEventListener("click", closeSetup);
  btnApply.addEventListener("click", apply);

  // Dropdown
  function buildList() {
    var frag = document.createDocumentFragment();
    PRESETS.forEach(function (p) {
      var li = document.createElement("li");
      li.textContent = p;
      li.setAttribute("role", "option");
      li.setAttribute("data-value", p);
      frag.appendChild(li);
    });
    listEl.appendChild(frag);
  }

  function openList() {
    var items = listEl.children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", items[i].getAttribute("data-value") === inputEl.value.trim());
    }
    // Nach oben öffnen, wenn unten zu wenig Platz ist
    var r = pickerEl.getBoundingClientRect();
    var below = window.innerHeight - r.bottom;
    listEl.classList.toggle("up", below < 260 && r.top > below);
    listEl.classList.add("open");
  }

  function closeList() {
    listEl.classList.remove("open");
  }

  function isListOpen() {
    return listEl.classList.contains("open");
  }

  toggleEl.addEventListener("click", function (e) {
    e.stopPropagation();
    if (isListOpen()) { closeList(); } else { openList(); }
  });

  listEl.addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== listEl && t.tagName !== "LI") { t = t.parentNode; }
    if (!t || t === listEl) { return; }
    inputEl.value = t.getAttribute("data-value");
    closeList();
    showError(false);
    updatePreview();
  });

  function onOutside(e) {
    if (isListOpen() && !pickerEl.contains(e.target)) { closeList(); }
  }
  document.addEventListener("mousedown", onOutside);
  document.addEventListener("touchstart", onOutside, { passive: true });

  // Freie Eingabe
  inputEl.addEventListener("input", function () {
    var ok = state.draftMode === "clock" ? parseClock(inputEl.value) !== null : parseTime(inputEl.value) !== null;
    if (errorEl.textContent && ok) { showError(false); }
    updatePreview();
  });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      inputEl.blur();
      apply();
    } else if (e.key === "Escape") {
      closeList();
    }
  });

  btnStart.addEventListener("click", start);
  btnStop.addEventListener("click", stop);
  btnResume.addEventListener("click", resume);
  btnReset.addEventListener("click", reset);

  // Nach Tab-Wechsel sofort korrekt aktualisieren
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { wake(); }
  });
  window.addEventListener("pageshow", wake);
  window.addEventListener("focus", wake);

  buildList();
  render();

  // PWA: Service Worker nur über http(s) registrieren (bei file:// läuft die App ohne)
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {});
    });
  }
})();
</script>
</body>
</html>
