<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer-MRO">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b1026">
<title>Timer-MRO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    background: #0b1026;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; cursor: pointer; }

  /* Zwei Seiten: Timer und Einstellungen */
  .view {
    display: none;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 3vh 16px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  body:not(.setup) #timerView { display: flex; }
  body.setup #setupView { display: flex; }

  .corner {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    min-height: 44px;
    min-width: 44px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .corner:active { background: rgba(255, 255, 255, 0.14); }
  .gear { right: 16px; width: 44px; height: 44px; border-radius: 50%; font-size: 22px; padding: 0; }
  .back { left: 16px; border: none; background: none; font-size: 17px; padding: 0 8px; }

  /* Timer-Seite: Wasserpegel = verbleibende Zeit */
  #timerView { --level: 100%; touch-action: none; overflow: hidden; }
  .gear { z-index: 5; }
  .water {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--level);
    background: linear-gradient(180deg, #38bdf8 0%, #1d4ed8 55%, #1e1b4b 100%);
    transition: height 0.4s ease;
  }
  .wave {
    position: absolute;
    left: 0;
    width: 200%;
    height: 36px;
    -webkit-animation: drift 9s linear infinite;
    animation: drift 9s linear infinite;
  }
  .wave path { fill: #38bdf8; }
  .wave.a { top: -34px; }
  .wave.b { top: -24px; opacity: 0.5; -webkit-animation-duration: 14s; animation-duration: 14s; -webkit-animation-direction: reverse; animation-direction: reverse; }
  @-webkit-keyframes drift { to { -webkit-transform: translateX(-50%); } }
  @keyframes drift { to { transform: translateX(-50%); } }
  .bubbles { position: absolute; inset: 0; overflow: hidden; }
  .bub {
    position: absolute;
    bottom: -30px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    -webkit-animation: rise linear infinite;
    animation: rise linear infinite;
  }
  @-webkit-keyframes rise { to { -webkit-transform: translateY(-110vh); } }
  @keyframes rise { to { transform: translateY(-110vh); } }
  @media (prefers-reduced-motion: reduce) {
    .wave, .bub { -webkit-animation: none; animation: none; }
  }
  /* Skala am rechten Rand mit Prozent-Schild am Wasserspiegel */
  .scale {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 22px;
    pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0 1px, transparent 1px 10%);
    -webkit-mask: linear-gradient(90deg, transparent 0 2px, #000 2px);
    mask: linear-gradient(90deg, transparent 0 2px, #000 2px);
  }
  .scale::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0 1px, transparent 1px 5%);
  }
  .mark {
    position: fixed;
    right: 30px;
    bottom: var(--level);
    -webkit-transform: translateY(50%);
    transform: translateY(50%);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.16);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    pointer-events: none;
    transition: bottom 0.4s ease;
  }
  /* Griff am Wasserspiegel (nur Modus Dauer) */
  .handle {
    position: fixed;
    left: 50%;
    bottom: var(--level);
    width: 56px;
    height: 5px;
    margin-left: -28px;
    margin-bottom: -2px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.5);
    pointer-events: none;
    transition: bottom 0.4s ease, opacity 0.2s ease;
  }
  #timerView.dragging .handle { background: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.8); }
  #timerView.dragging .water, #timerView.dragging .mark, #timerView.dragging .handle,
  #timerView.dragging .readout { transition: none; }
  .handle.hidden, .mark.hidden { opacity: 0; }
  /* Anzeige doppelt: über Wasser weiß, unter Wasser dunkel (per clip-path an der Oberfläche getrennt) */
  .readout {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 8vh;
    pointer-events: none;
    transition: clip-path 0.4s ease, -webkit-clip-path 0.4s ease;
  }
  .readout.above { color: #ffffff; -webkit-clip-path: inset(0 0 var(--level) 0); clip-path: inset(0 0 var(--level) 0); }
  /* Ziffern auch unter Wasser hell, mit leichtem Schatten für Kontrast */
  .readout.below { color: #ffffff; text-shadow: 0 2px 14px rgba(11, 16, 38, 0.45); -webkit-clip-path: inset(calc(100% - var(--level)) 0 0 0); clip-path: inset(calc(100% - var(--level)) 0 0 0); }
  .display {
    font-size: min(17vw, 24vh);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    text-align: center;
    white-space: nowrap;
  }
  .readout.above .display.done { color: #fca5a5; }
  .info {
    min-height: 1.4em;
    margin-top: 14px;
    font-size: 20px;
    font-weight: 500;
    opacity: 0.85;
    text-align: center;
  }
  .preset {
    margin-top: 2px;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
    font-variant-numeric: tabular-nums;
  }
  /* Aquarium: Framework-Meeresbewohner schwimmen im Wasser */
  .fishtoggle {
    right: 70px;
    width: auto;
    height: 44px;
    padding: 0 12px;
    border-radius: 22px;
    font-size: 18px;
    z-index: 5;
  }
  .fishtoggle.off { opacity: 0.45; }
  .aquarium { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .aquarium.off { display: none; }
  .sand {
    position: absolute;
    left: -5%;
    right: -5%;
    bottom: 0;
    height: 6%;
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
    background: linear-gradient(#c2a26b, #8a6d3b);
    opacity: 0.5;
  }
  .weed {
    position: absolute;
    bottom: 3%;
    width: 12px;
    border-radius: 6px 6px 0 0;
    background: #15803d;
    opacity: 0.6;
    -webkit-transform-origin: bottom;
    transform-origin: bottom;
    -webkit-animation: sway 5s ease-in-out infinite alternate;
    animation: sway 5s ease-in-out infinite alternate;
  }
  @-webkit-keyframes sway { from { -webkit-transform: rotate(-7deg); } to { -webkit-transform: rotate(7deg); } }
  @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  /* Bodenbewohner: Krabbe und Muschel graben im Sand */
  .dweller { position: absolute; bottom: 2.5%; }
  .dweller svg { display: block; width: 100%; height: auto; overflow: visible; }
  .crab { left: 16%; width: clamp(66px, 10vmin, 110px); animation: crabwalk 45s ease-in-out infinite; }
  @keyframes crabwalk {
    0%, 8% { transform: translateX(0); }
    24%, 40% { transform: translateX(16vw); }
    52%, 64% { transform: translateX(7vw); }
    80%, 100% { transform: translateX(0); }
  }
  .crab .claw, .crab .leg { transform-box: fill-box; }
  .crab .claw { transform-origin: 50% 100%; animation: dig 1.2s ease-in-out infinite alternate; }
  .crab .claw.r { animation-delay: -0.6s; }
  @keyframes dig { from { transform: rotate(-28deg) translateY(-2px); } to { transform: rotate(16deg) translateY(3px); } }
  .crab .leg { transform-origin: 50% 0; animation: step 0.9s ease-in-out infinite alternate; }
  .crab .leg:nth-child(even) { animation-delay: -0.45s; }
  @keyframes step { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .clam { left: 70%; width: clamp(52px, 8vmin, 86px); transform-origin: 50% 100%; animation: clamdig 8s ease-in-out infinite; }
  @keyframes clamdig {
    0%, 100% { transform: translateY(0) rotate(0); }
    10% { transform: translateY(3px) rotate(-6deg); }
    20% { transform: translateY(5px) rotate(6deg); }
    30% { transform: translateY(2px) rotate(-3deg); }
    40%, 90% { transform: translateY(0) rotate(0); }
  }
  .clam .lid { transform-box: fill-box; transform-origin: 6% 100%; animation: clamopen 8s ease-in-out infinite; }
  @keyframes clamopen { 0%, 45% { transform: rotate(0); } 55%, 80% { transform: rotate(-24deg); } 90%, 100% { transform: rotate(0); } }
  .puff { position: absolute; bottom: 4%; width: 5px; height: 5px; border-radius: 50%; background: #d6b98a; opacity: 0; animation: puff 1.4s ease-out infinite; }
  .puff:nth-of-type(2) { animation-delay: -0.5s; margin-left: 8px; }
  .puff:nth-of-type(3) { animation-delay: -0.9s; margin-left: -6px; }
  @keyframes puff { 0% { transform: translate(0, 0) scale(0.6); opacity: 0.9; } 100% { transform: translate(-10px, -22px) scale(1.3); opacity: 0; } }
  .crab .puff { left: 6%; }
  .crab .puff + .puff + .puff { left: 88%; }
  .clam .puff { left: 50%; animation-duration: 8s; }
  .clam .puff:nth-of-type(2) { animation-delay: -0.4s; }
  .clam .puff:nth-of-type(3) { animation-delay: -0.8s; }
  .critter {
    position: absolute;
    left: 0;
    top: 0;
    will-change: transform;
    transition: opacity 0.4s ease;
  }
  .critter .body { width: 100%; height: 100%; }
  /* Krake: acht Arme wackeln abwechselnd */
  .octo .arm {
    -webkit-transform-box: fill-box;
    transform-box: fill-box;
    -webkit-transform-origin: 50% 0;
    transform-origin: 50% 0;
    -webkit-animation: wiggle 1.6s ease-in-out infinite alternate;
    animation: wiggle 1.6s ease-in-out infinite alternate;
  }
  .octo .arm:nth-child(even) { -webkit-animation-delay: -0.8s; animation-delay: -0.8s; }
  @-webkit-keyframes wiggle { from { -webkit-transform: rotate(-12deg); } to { -webkit-transform: rotate(12deg); } }
  @keyframes wiggle { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .critter .body svg { display: block; width: 100%; height: 100%; }
  .critter.left .body { -webkit-transform: scaleX(-1); transform: scaleX(-1); }
  .critter .body { -webkit-transition: -webkit-transform 0.35s ease; transition: transform 0.35s ease; }

  .buttons-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(5vh, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    padding: 0 16px;
    z-index: 4;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .buttons button {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.9);
    background: rgba(11, 16, 38, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.22);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: transform 0.08s ease, opacity 0.15s ease, border-color 0.15s ease;
  }
  .buttons button i { width: 8px; height: 8px; border-radius: 50%; }
  .buttons button:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.14); }
  .buttons button:disabled { opacity: 0.35; cursor: default; transform: none; }
  #btnStart i  { background: #22c55e; }
  #btnStop i   { background: #ef4444; }
  #btnResume i { background: #3b82f6; }
  #btnReset i  { background: #9ca3af; }
  /* nächste sinnvolle Aktion leicht hervorheben */
  #btnStart.next  { border-color: rgba(34, 197, 94, 0.7); }
  #btnStop.next   { border-color: rgba(248, 113, 113, 0.7); }
  #btnResume.next { border-color: rgba(96, 165, 250, 0.7); }

  /* Einstellungsseite */
  .setup-card {
    width: min(380px, 86vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .setup-card h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7dd3fc;
  }
  .modes {
    display: flex;
    padding: 3px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .modes button {
    min-width: 96px;
    min-height: 36px;
    padding: 6px 18px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
  }
  .modes button.active { background: rgba(255, 255, 255, 0.16); color: #ffffff; }
  .picker {
    position: relative;
    display: flex;
    align-items: center;
    width: 220px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }
  .picker input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 44px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    padding: 4px 0 8px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: #ffffff;
    outline: none;
    text-align: center;
    -webkit-user-select: text;
    user-select: text;
    -webkit-appearance: none;
    appearance: none;
    -webkit-touch-callout: default;
  }
  .picker input::placeholder { color: rgba(255, 255, 255, 0.3); }
  .picker input.invalid { color: #fca5a5; }
  .picker:focus-within { border-bottom-color: #38bdf8; }
  .toggle {
    min-width: 44px;
    min-height: 44px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #7dd3fc;
  }
  .toggle:active { background: rgba(255, 255, 255, 0.1); }
  .list {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: -30px;
    right: -30px;
    max-height: 40vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0;
    padding: 6px;
    list-style: none;
    border-radius: 14px;
    background: rgba(15, 23, 52, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
  .list.open { display: block; }
  .list.up { top: auto; bottom: calc(100% + 8px); }
  .list li {
    font-size: 20px;
    padding: 11px 16px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .list li:hover, .list li.active { background: rgba(56, 189, 248, 0.22); }
  .picker.clock .toggle, .picker.clock .list { display: none; }
  .preview {
    min-height: 1.4em;
    font-size: 15px;
    color: rgba(125, 211, 252, 0.85);
    text-align: center;
  }
  .error {
    font-size: 15px;
    color: #fecaca;
    text-align: center;
  }
  .error:empty { display: none; }
  .apply {
    min-height: 44px;
    padding: 10px 34px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid rgba(56, 189, 248, 0.7);
    background: rgba(56, 189, 248, 0.12);
    color: #e0f2fe;
  }
  .apply:active { background: rgba(56, 189, 248, 0.3); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <!-- Fische, nach rechts gezeichnet; Farbe über currentColor -->
 <symbol id="sym-fish" viewBox="0 0 120 70">

  <ellipse cx="64" cy="36" rx="42" ry="21" fill="currentColor"/>
  <path d="M58 17 Q68 36 58 55" stroke="#fff" stroke-width="4" fill="none" opacity=".25"/>
  <path d="M74 16 Q82 36 74 56" stroke="#fff" stroke-width="3" fill="none" opacity=".18"/>
  <circle cx="90" cy="30" r="5.5" fill="#fff"/><circle cx="91.5" cy="30" r="2.8" fill="#0b1026"/>
 </symbol>
 <!-- entspannter Hai: halb geschlossenes Auge, Lächeln -->
 <symbol id="sym-shark" viewBox="0 0 220 90">
  <path d="M40 46 L4 14 L16 46 L6 76Z" fill="#64748b"/>
  <path d="M96 30 L112 0 L130 30Z" fill="#64748b"/>
  <path d="M30 46 Q70 18 150 24 Q200 30 214 48 Q196 62 150 66 Q70 72 30 46Z" fill="#94a3b8"/>

 </symbol>
 <symbol id="sym-fish2" viewBox="0 0 100 90">
  <path d="M24 45 L4 30 L8 45 L4 60Z" fill="currentColor" opacity=".75"/>
  <path d="M40 22 L52 2 L66 24Z M40 68 L52 88 L66 66Z" fill="currentColor" opacity=".7"/>
  <path d="M22 45 Q50 10 84 40 Q86 45 84 50 Q50 80 22 45Z" fill="currentColor"/>

  <circle cx="72" cy="40" r="4.5" fill="#fff"/><circle cx="73.2" cy="40" r="2.3" fill="#0b1026"/>
 </symbol>

<div class="view" id="timerView">
  <button type="button" class="corner fishtoggle" id="btnFish" aria-label="Aquarium an/aus" aria-pressed="true">&#128031;</button>
  <button type="button" class="corner gear" id="btnSetup" aria-label="Einstellungen">&#9881;&#xFE0E;</button>

  <div class="water" aria-hidden="true">
    <svg class="wave b" viewBox="0 0 2000 36" preserveAspectRatio="none"><path d="M0 18 Q125 4 250 18 T500 18 T750 18 T1000 18 T1250 18 T1500 18 T1750 18 T2000 18 V36 H0Z"/></svg>
    <svg class="wave a" viewBox="0 0 2000 36" preserveAspectRatio="none"><path d="M0 20 Q166 4 333 20 T666 20 T1000 20 T1333 20 T1666 20 T2000 20 V36 H0Z"/></svg>
    <div class="bubbles">
    <div class="bub" style="width:16px;height:16px;left:18%;-webkit-animation-duration:13s;animation-duration:13s"></div>
    <div class="bub" style="width:9px;height:9px;left:74%;-webkit-animation-duration:9s;animation-duration:9s;-webkit-animation-delay:-4s;animation-delay:-4s"></div>
    <div class="bub" style="width:24px;height:24px;left:61%;-webkit-animation-duration:17s;animation-duration:17s;-webkit-animation-delay:-9s;animation-delay:-9s"></div>
    <div class="bub" style="width:7px;height:7px;left:33%;-webkit-animation-duration:11s;animation-duration:11s;-webkit-animation-delay:-2s;animation-delay:-2s"></div>
    </div>
  </div>
  <div class="scale" aria-hidden="true"></div>
  <div class="mark" id="mark">100 %</div>
  <div class="handle" id="handle"></div>

  <div class="aquarium" id="aquarium">
    <div class="sand"></div>
    <div class="weed" style="left:5%;height:15%"></div>
    <div class="weed" style="left:7%;height:10%;animation-delay:-2s;-webkit-animation-delay:-2s"></div>
    <div class="weed" style="left:89%;height:13%;animation-delay:-1s;-webkit-animation-delay:-1s"></div>
    <div class="weed" style="left:91.5%;height:8%;animation-delay:-3s;-webkit-animation-delay:-3s"></div>

<div class="view" id="setupView">
  <button type="button" class="corner back" id="btnBack">&lsaquo; Timer</button>

  <div class="setup-card">
    <h1>Timer einstellen</h1>

    <div class="modes" role="group" aria-label="Modus">
      <button type="button" id="modeDuration" class="active">Dauer</button>
      <button type="button" id="modeClock">Uhrzeit</button>
    </div>

    <div class="picker" id="picker">
      <input type="text" id="timeInput" value="1:30" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="H:MM" aria-label="Zeit (H:MM)">
      <button type="button" class="toggle" id="toggle" aria-label="Vorschläge anzeigen">&#9662;</button>

<script>
(function () {
  "use strict";

  var PRESETS = ["0:06", "0:10", "0:12", "0:15", "0:30", "0:45", "1:00", "1:15", "1:30", "1:45", "2:00", "2:15", "2:30", "2:53"];
  var ERROR_TEXT = "Bitte Format H:MM verwenden, z. B. 1:30";
  var ERROR_TEXT_CLOCK = "Bitte Uhrzeit im Format HH:MM verwenden, z. B. 14:30";
  var DEFAULT_TIME = "1:30";
  var MAX_LEVEL = 0.88;   // voller Pegel bleibt unter dem Zahnrad sichtbar
  var MINUTE = 60000;

  var displayEl = document.getElementById("display");
  var inputEl = document.getElementById("timeInput");
  var toggleEl = document.getElementById("toggle");
  var listEl = document.getElementById("list");
  var pickerEl = document.getElementById("picker");
  var errorEl = document.getElementById("error");
  var previewEl = document.getElementById("preview");
  var btnStart = document.getElementById("btnStart");
  var btnStop = document.getElementById("btnStop");
  var btnResume = document.getElementById("btnResume");
  var btnReset = document.getElementById("btnReset");
  var btnSetup = document.getElementById("btnSetup");
  var btnBack = document.getElementById("btnBack");
  var btnApply = document.getElementById("btnApply");
  var modeDurationEl = document.getElementById("modeDuration");
  var modeClockEl = document.getElementById("modeClock");
  var infoEl = document.getElementById("info");
  var presetEl = document.getElementById("preset");
  var display2El = document.getElementById("display2");
  var info2El = document.getElementById("info2");
  var preset2El = document.getElementById("preset2");
  var timerViewEl = document.getElementById("timerView");
  var markEl = document.getElementById("mark");
  var handleEl = document.getElementById("handle");

  var state = {
    baseMs: parseTime(DEFAULT_TIME),
    remainingMs: parseTime(DEFAULT_TIME),
    endTime: 0,
    running: false,
    intervalId: null,
    alertPending: false,
    mode: "duration",
    target: 0,
    clock: null,
    values: { duration: DEFAULT_TIME, clock: "" },
    targetText: "",
    draftMode: "duration",
    adjusted: false,
    drag: null
  };

  function parseTime(text) {
    var m = /^(\d{1,2}):([0-5]\d)$/.exec(String(text).trim());
    if (!m) { return null; }
    var ms = (parseInt(m[1], 10) * 3600 + parseInt(m[2], 10) * 60) * 1000;
    return ms > 0 ? ms : null;
  }

  function parseClock(text) {
    var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(text).trim());
    if (!m) { return null; }
    return { h: parseInt(m[1], 10), m: parseInt(m[2], 10) };
  }

  // Nächster Zeitpunkt mit dieser Uhrzeit: heute, sonst morgen
  function nextTarget(clock) {
    var now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), clock.h, clock.m, 0, 0);
    if (t.getTime() <= now.getTime()) {
      t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, clock.h, clock.m, 0, 0);
    }
    return t.getTime();
  }

  function isTomorrow(ms) {
    var now = new Date();
    var t = new Date(ms);
    return t.getDate() !== now.getDate() || t.getMonth() !== now.getMonth() || t.getFullYear() !== now.getFullYear();
  }

  function targetText(clock, target) {
    return "Ziel: " + pad(clock.h) + ":" + pad(clock.m) + " Uhr (" + (isTomorrow(target) ? "morgen" : "heute") + ")";
  }

  function setTarget(clock) {
    state.clock = clock;
    state.target = nextTarget(clock);
    state.targetText = targetText(clock, state.target);
  }

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function clockOf(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function format(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function infoText() {
    if (state.remainingMs <= 0) { return "Zeit abgelaufen"; }
    if (state.mode === "clock") { return state.targetText; }
    if (state.running) { return "Ende um " + clockOf(state.endTime) + " Uhr"; }
    return "";
  }

  function canResume() {
    return !state.running && state.remainingMs > 0 && state.remainingMs < state.baseMs;
  }

  function setText(el, el2, text) {
    if (el.textContent !== text) {
      el.textContent = text;
      el2.textContent = text;
    }
  }

  function render() {
    setText(displayEl, display2El, format(state.remainingMs));
    displayEl.classList.toggle("done", state.remainingMs <= 0);
    // Wasserpegel: Anteil der verbleibenden Zeit
    var frac = state.baseMs > 0 ? Math.min(1, Math.max(0, state.remainingMs / state.baseMs)) : 0;
    timerViewEl.style.setProperty("--level", (frac * MAX_LEVEL * 100).toFixed(2) + "%");
    var pct = Math.round(frac * 100) + " %";
    if (markEl.textContent !== pct) { markEl.textContent = pct; }
    markEl.classList.toggle("hidden", frac <= 0);
    var adjustable = state.mode === "duration" && state.baseMs > 0;
    handleEl.classList.toggle("hidden", !adjustable || frac <= 0);
    setText(infoEl, info2El, infoText());
    setText(presetEl, preset2El, (state.mode === "clock" ? "Uhrzeit " : "Dauer ") + state.values[state.mode]);
    btnStop.disabled = !state.running;
    btnResume.disabled = !canResume();
    btnStart.classList.toggle("next", !state.running && !canResume());
    btnStop.classList.toggle("next", state.running);
    btnResume.classList.toggle("next", canResume());
  }

  function clearTick() {
    if (state.intervalId !== null) {
      clearInterval(state.intervalId);
      state.intervalId = null;
    }
  }

  function tick() {
    if (!state.running) { return; }
    state.remainingMs = state.endTime - Date.now();
    if (state.remainingMs <= 0) {
      finish();
      return;
    }
    render();
  }

  function finish() {
    clearTick();
    state.running = false;
    state.remainingMs = 0;
    render();
    state.alertPending = true;
    // iOS unterdrückt alert() in Hintergrund-Tabs: erst anzeigen, wenn sichtbar
    if (!document.hidden) { showAlert(); }
  }

  function showAlert() {
    if (!state.alertPending) { return; }
    state.alertPending = false;
    setTimeout(function () {
      alert("Zeit abgelaufen!");
    }, 30);
  }

  function wake() {
    tick();
    if (!document.hidden) { showAlert(); }
  }

  function run() {
    clearTick();
    state.alertPending = false;
    state.running = true;
    // Uhrzeit-Modus: immer gegen die feste Zielzeit zählen
    state.endTime = state.mode === "clock" ? state.target : Date.now() + state.remainingMs;
    state.intervalId = setInterval(tick, 200);
    tick();
  }

  function stop() {
    if (!state.running) { return; }
    state.remainingMs = Math.max(0, state.endTime - Date.now());
    clearTick();
    state.running = false;
    render();
  }

  // Ausgangswert neu setzen (Uhrzeit-Modus: Zielzeit neu berechnen)
  function rearm() {
    if (state.mode === "clock" && state.clock) {
      setTarget(state.clock);
      state.baseMs = state.target - Date.now();
    }
    state.remainingMs = state.baseMs;
  }

  function start() {
    clearTick();
    state.running = false;
    // Am Wasserspiegel eingestellte Restzeit gilt für den nächsten Start
    if (!state.adjusted || state.remainingMs <= 0) { rearm(); }
    state.adjusted = false;
    run();
  }

  function resume() {
    if (state.running || state.remainingMs <= 0) { return; }
    run();
  }

  function reset() {
    clearTick();
    state.alertPending = false;
    state.running = false;
    state.adjusted = false;
    rearm();
    render();
  }

  // Einstellungsseite
  function defaultClock() {
    var d = new Date(Date.now() + 3600000);
    return pad(d.getHours()) + ":00";
  }

  function showError(show) {
    errorEl.textContent = show ? (state.draftMode === "clock" ? ERROR_TEXT_CLOCK : ERROR_TEXT) : "";
    inputEl.classList.toggle("invalid", !!show);
  }

  function updatePreview() {
    var text = "";
    if (state.draftMode === "clock") {
      var clock = parseClock(inputEl.value);
      if (clock) { text = targetText(clock, nextTarget(clock)); }
    } else {
      var ms = parseTime(inputEl.value);
      if (ms) { text = "läuft bis ca. " + clockOf(Date.now() + ms) + " Uhr"; }
    }
    previewEl.textContent = text;
  }

  // Modus auf der Einstellungsseite nur vormerken; wirksam erst mit „Übernehmen“
  function setDraftMode(mode) {
    closeList();
    showError(false);
    state.draftMode = mode;
    var clockMode = mode === "clock";
    modeDurationEl.classList.toggle("active", !clockMode);
    modeClockEl.classList.toggle("active", clockMode);
    pickerEl.classList.toggle("clock", clockMode);
    inputEl.placeholder = clockMode ? "HH:MM" : "H:MM";
    inputEl.setAttribute("aria-label", clockMode ? "Zielzeit (HH:MM)" : "Zeit (H:MM)");
    inputEl.value = state.values[mode] || (clockMode ? defaultClock() : DEFAULT_TIME);
    updatePreview();
  }

  function openSetup() {
    setDraftMode(state.mode);
    document.body.classList.add("setup");
    window.scrollTo(0, 0);
  }

  function closeSetup() {
    closeList();
    inputEl.blur();
    showError(false);
    document.body.classList.remove("setup");
    window.scrollTo(0, 0);
  }

  // Übernehmen: Timer stoppen und auf den neuen Wert setzen
  function apply() {
    closeList();
    var ms;
    if (state.draftMode === "clock") {
      var clock = parseClock(inputEl.value);
      if (clock === null) {
        showError(true);
        return;
      }
      setTarget(clock);
      ms = state.target - Date.now();
    } else {
      ms = parseTime(inputEl.value);
      if (ms === null) {
        showError(true);
        return;
      }
    }
    state.mode = state.draftMode;
    state.values[state.mode] = inputEl.value.trim();
    clearTick();
    state.running = false;
    state.alertPending = false;
    state.baseMs = ms;
    state.remainingMs = ms;
    state.adjusted = false;
    render();
    closeSetup();
  }

  modeDurationEl.addEventListener("click", function () { setDraftMode("duration"); });
  modeClockEl.addEventListener("click", function () { setDraftMode("clock"); });
  btnSetup.addEventListener("click", openSetup);
  btnBack.addEventListener("click", closeSetup);
  btnApply.addEventListener("click", apply);

  // Dropdown
  function buildList() {
    var frag = document.createDocumentFragment();
    PRESETS.forEach(function (p) {
      var li = document.createElement("li");
      li.textContent = p;
      li.setAttribute("role", "option");
      li.setAttribute("data-value", p);
      frag.appendChild(li);
    });
    listEl.appendChild(frag);
  }

  function openList() {
    var items = listEl.children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", items[i].getAttribute("data-value") === inputEl.value.trim());
    }
    // Nach oben öffnen, wenn unten zu wenig Platz ist
    var r = pickerEl.getBoundingClientRect();
    var below = window.innerHeight - r.bottom;
    listEl.classList.toggle("up", below < 260 && r.top > below);
    listEl.classList.add("open");
  }

  function closeList() {
    listEl.classList.remove("open");
  }

  function isListOpen() {
    return listEl.classList.contains("open");
  }

  toggleEl.addEventListener("click", function (e) {
    e.stopPropagation();
    if (isListOpen()) { closeList(); } else { openList(); }
  });

  listEl.addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== listEl && t.tagName !== "LI") { t = t.parentNode; }
    if (!t || t === listEl) { return; }
    inputEl.value = t.getAttribute("data-value");
    closeList();
    showError(false);
    updatePreview();
  });

  function onOutside(e) {
    if (isListOpen() && !pickerEl.contains(e.target)) { closeList(); }
  }
  document.addEventListener("mousedown", onOutside);
  document.addEventListener("touchstart", onOutside, { passive: true });

  // Freie Eingabe
  inputEl.addEventListener("input", function () {
    var ok = state.draftMode === "clock" ? parseClock(inputEl.value) !== null : parseTime(inputEl.value) !== null;
    if (errorEl.textContent && ok) { showError(false); }
    updatePreview();
  });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      inputEl.blur();
      apply();
    } else if (e.key === "Escape") {
      closeList();
    }
  });

  btnStart.addEventListener("click", start);
  btnStop.addEventListener("click", stop);
  btnResume.addEventListener("click", resume);
  btnReset.addEventListener("click", reset);

  // Restzeit am Wasserspiegel ziehen (nur Modus Dauer): Minutenschritte, max. Ausgangszeit
  var GRAB = 60;   // Fangbereich um den Wasserspiegel in px

  function levelAt(e) {
    var h = window.innerHeight;
    return Math.min(1, Math.max(0, (1 - e.clientY / h) / MAX_LEVEL));
  }

  function setFromLevel(frac) {
    var ms = Math.round(frac * state.baseMs / MINUTE) * MINUTE;
    state.remainingMs = Math.min(state.baseMs, Math.max(MINUTE, ms));
    render();
  }

  timerViewEl.addEventListener("pointerdown", function (e) {
    if (state.mode !== "duration" || state.baseMs <= 0) { return; }
    if (e.target.closest && e.target.closest("button")) { return; }
    var frac = state.remainingMs / state.baseMs;
    var surfaceY = window.innerHeight * (1 - frac * MAX_LEVEL);
    if (Math.abs(e.clientY - surfaceY) > GRAB) { return; }   // nur am Wasserspiegel
    e.preventDefault();
    var wasRunning = state.running;
    if (wasRunning) { stop(); }
    state.drag = { id: e.pointerId, wasRunning: wasRunning };
    state.alertPending = false;
    timerViewEl.classList.add("dragging");
    if (timerViewEl.setPointerCapture) { timerViewEl.setPointerCapture(e.pointerId); }
  });

  timerViewEl.addEventListener("pointermove", function (e) {
    if (!state.drag || e.pointerId !== state.drag.id) { return; }
    e.preventDefault();
    setFromLevel(levelAt(e));
  });

  function endDrag(e) {
    if (!state.drag || e.pointerId !== state.drag.id) { return; }
    var wasRunning = state.drag.wasRunning;
    state.drag = null;
    timerViewEl.classList.remove("dragging");
    if (wasRunning) {
      run();
    } else {
      state.adjusted = true;
      render();
    }
  }
  timerViewEl.addEventListener("pointerup", endDrag);
  timerViewEl.addEventListener("pointercancel", endDrag);

  // Nach Tab-Wechsel sofort korrekt aktualisieren
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { wake(); }
  });
  window.addEventListener("pageshow", wake);
  window.addEventListener("focus", wake);

  // Aquarium: ein paar bunte Fische schwimmen dynamisch hin und her (nur Optik)
  var aquariumEl = document.getElementById("aquarium");
  var btnFish = document.getElementById("btnFish");

  var FISH = [
    { sym: "fish", w: 96, h: 56, color: "#fb923c" },
    { sym: "fish", w: 70, h: 41, color: "#facc15" },
    { sym: "fish", w: 110, h: 64, color: "#2dd4bf" },
    { sym: "fish2", w: 54, h: 49, color: "#c084fc" },
    // entspannter Hai: groß, gleitet langsam und gleichmäßig
    { sym: "shark", w: 220, h: 90, color: "#94a3b8", min: 22, max: 38, calm: true },
    // Krake: schwebt langsam, pulsiert auf und ab, Arme wackeln
    { octo: true, w: 90, h: 104, color: "#f472b6", min: 10, max: 28 }
  ];

  var OCTO_SVG = '<svg class="octo" viewBox="0 0 90 104">' +
    '<g fill="#db2777">' +
    [8, 17, 26, 35, 49, 58, 67, 76].map(function (x, k) {
      return '<path class="arm" d="M' + x + ' 44 q' + (k < 4 ? -6 : 6) + ' 20 0 34 q' + (k < 4 ? 6 : -6) + ' 12 ' + (k < 4 ? -4 : 4) + ' 22" stroke="#db2777" stroke-width="7" stroke-linecap="round" fill="none"/>';
    }).join("") +
    '</g>' +
    '<path d="M6 48 Q4 4 45 4 Q86 4 84 48 Q66 56 45 50 Q24 56 6 48Z" fill="#f472b6"/>' +
    '<ellipse cx="30" cy="20" rx="8" ry="5" fill="#fff" opacity=".25"/>' +
    '<circle cx="33" cy="32" r="6" fill="#fff"/><circle cx="34" cy="33" r="3" fill="#0b1026"/>' +
    '<circle cx="57" cy="32" r="6" fill="#fff"/><circle cx="58" cy="33" r="3" fill="#0b1026"/>' +
    '<path d="M38 42 q7 5 14 0" stroke="#831843" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
    '</svg>';

  var critters = [];
  var aqua = { on: true, last: 0 };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeFish(kind) {
    var el = document.createElement("div");
    el.className = "critter";
    el.style.color = kind.color;
    el.innerHTML = '<div class="body">' + (kind.octo ? OCTO_SVG : '<svg viewBox="0 0 ' + kind.w + " " + kind.h + '"><use href="#sym-' + kind.sym + '" xlink:href="#sym-' + kind.sym + '"/></svg>') + "</div>";
    aquariumEl.appendChild(el);
    critters.push({
      kind: kind, el: el,
      x: rand(0, window.innerWidth), dir: Math.random() < 0.5 ? -1 : 1,
      depth: rand(0.05, 0.95), targetDepth: rand(0.05, 0.95),
      speed: rand(kind.min || 14, kind.max || 40), base: rand(kind.min || 14, kind.max || 40),
      phase: rand(0, 6.28), nextChange: 0
    });
  }

  function setAquarium(on) {
    aqua.on = on;
    aquariumEl.classList.toggle("off", !on);
    btnFish.classList.toggle("off", !on);
    btnFish.setAttribute("aria-pressed", on ? "true" : "false");
    try { localStorage.setItem("timer-mro-aquarium", on ? "1" : "0"); } catch (err) { /* ohne Speicher */ }
  }

  btnFish.addEventListener("click", function () { setAquarium(!aqua.on); });

  function animateAquarium(now) {
    requestAnimationFrame(animateAquarium);
    var dt = Math.min(0.1, (now - (aqua.last || now)) / 1000);
    aqua.last = now;
    if (!aqua.on || document.hidden || document.body.classList.contains("setup")) { return; }

    var W = window.innerWidth;
    var H = window.innerHeight;
    var frac = state.baseMs > 0 ? Math.min(1, Math.max(0, state.remainingMs / state.baseMs)) : 0;
    var waterTop = H * (1 - frac * MAX_LEVEL);
    var floor = H * 0.95;
    var scale = Math.max(0.6, Math.min(1.1, Math.min(W, H) / 820));
    // bei niedrigem Pegel werden die Fische kleiner
    scale *= Math.max(0.45, Math.min(1, (floor - waterTop) / (H * 0.35)));
    var tempo = state.running ? 1 : 0.7;

    for (var i = 0; i < critters.length; i++) {
      var c = critters[i];
      var w = c.kind.w * scale, h = c.kind.h * scale;
      c.el.style.width = w + "px";
      c.el.style.height = h + "px";

      // ab und zu: neues Tempo, neue Tiefe, manchmal umdrehen
      if (now > c.nextChange) {
        c.nextChange = now + rand(5000, 12000);
        c.base = rand(c.kind.min || 12, c.kind.max || 42);
        c.targetDepth = c.kind.calm ? rand(0.35, 0.75) : rand(0.05, 0.95);
        if (Math.random() < (c.kind.calm ? 0.08 : 0.25)) { c.dir = -c.dir; }
      }
      c.speed += (c.base - c.speed) * Math.min(1, dt * 1.5);
      c.depth += (c.targetDepth - c.depth) * Math.min(1, dt * 0.2);
      c.x += c.speed * scale * tempo * c.dir * dt;
      if (c.x > W - w * 0.3) { c.dir = -1; }
      if (c.x < -w * 0.7) { c.dir = 1; }

      var top = waterTop + 30, bottom = floor - h;
      var bob = c.kind.octo ? Math.sin(now / 1800 + c.phase) * 22 : Math.sin(now / 1500 + c.phase) * 6;
      var y = top + Math.max(0, bottom - top) * c.depth + bob * scale;
      var tilt = c.kind.octo ? Math.sin(now / 1800 + c.phase) * 6 : Math.sin(now / (c.kind.calm ? 1400 : 900) + c.phase) * (c.kind.calm ? 1.5 : 4);

      c.el.classList.toggle("left", c.dir < 0 && !c.kind.octo);
      c.el.style.opacity = y > waterTop + 6 ? "1" : "0";
      c.el.style.transform = "translate3d(" + c.x.toFixed(1) + "px," + y.toFixed(1) + "px,0) rotate(" + tilt.toFixed(1) + "deg)";
    }
  }

  FISH.forEach(makeFish);
  (function () {
    var on = true;
    try { on = localStorage.getItem("timer-mro-aquarium") !== "0"; } catch (err) { /* ohne Speicher */ }
    setAquarium(on);
  })();
  requestAnimationFrame(animateAquarium);

  buildList();
  render();

  // PWA: Service Worker nur über http(s) registrieren (bei file:// läuft die App ohne)
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {});
    });
  }
})();
</script>
</body>
